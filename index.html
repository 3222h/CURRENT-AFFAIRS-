<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speedy One Liners | Study Portal</title>
    <style>
        :root {
            --bg-base: #0f172a;
            --accent-glow: #38bdf8;
            --accent-secondary: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.5);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Blobs */
        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.4;
            animation: float 20s infinite alternate linear;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-glow);
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background: var(--accent-secondary);
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(100px, 150px) rotate(45deg); }
        }

        /* Main Container */
        .dashboard-container {
            width: 100%;
            max-width: 1000px;
            padding: 3rem 2rem;
            z-index: 1;
            flex-grow: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #fff, var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* Search / Filter Bar */
        .search-container {
            margin: 0 auto 3rem auto;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 16px; 
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .search-input:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* Grid Layout */
        .month-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        /* Glassmorphism Cards */
        .month-card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease, opacity 0.3s ease;
        }

        .month-card.unavailable {
            opacity: 0.75;
        }

        .month-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(
                800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                rgba(255, 255, 255, 0.08),
                transparent 40%
            );
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        @media (hover: hover) {
            .month-card:hover::before { opacity: 1; }
            .month-card:hover {
                transform: translateY(-4px);
                border-color: rgba(255, 255, 255, 0.3);
            }
            .month-card:hover .card-icon {
                background: var(--accent-glow);
                color: #000;
                transform: translateX(4px);
            }
        }

        .month-card:active,
        .month-card.touch-active {
            transform: scale(0.95);
            border-color: var(--accent-glow);
        }
        
        .month-card.touch-active::before { opacity: 1; }

        .card-content-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
        }

        .card-content {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Coming Soon Badge */
        .badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-glow);
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 700;
            width: fit-content;
        }

        .card-icon {
            position: relative;
            z-index: 1;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .card-icon svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* No Results Message */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
            display: none; /* Hidden by default */
        }

        .hidden { display: none !important; }

        footer {
            width: 100%;
            text-align: center;
            padding: 2rem 0;
            border-top: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: auto;
        }

        .author-name {
            background: linear-gradient(to right, var(--accent-glow), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.05em;
        }

        .author-name strong {
            font-weight: 900;
            font-size: 1.1em;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .dashboard-container { padding: 2rem 1.5rem; }
            .month-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="dashboard-container">
        <header>
            <h1>Speedy One Liners</h1>
            <p class="subtitle">Quick revision modules and study materials</p>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search for a month (e.g., March)...">
        </div>

        <main class="month-grid" id="monthGrid">
            <div id="noResults" class="no-results">No months match your search.</div>
            <!-- Cards are generated via JavaScript -->
        </main>
    </div>

<footer>
    BY: <span class="author-name"><strong><a href="https://github.com/3222h/" target="_blank" rel="noopener noreferrer">ASHUTOSH SINGH</a></strong></span>
</footer>



    <script>
        // Array of months with an 'available' flag. 
        // Change available to 'true' when you create that month's page.
        const monthsData = [
            { name: "January", available: false },
            { name: "February", available: false },
            { name: "March", available: false },
            { name: "April", available: false },
            { name: "May", available: false },
            { name: "June", available: false },
            { name: "July", available: true },
            { name: "August", available: false },
            { name: "September", available: false },
            { name: "October", available: false },
            { name: "November", available: false },
            { name: "December", available: false }
        ];

        const grid = document.getElementById('monthGrid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');

        const arrowIcon = `
            <svg viewBox="0 0 24 24">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        `;
        const lockIcon = `
            <svg viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0110 0v4"></path>
            </svg>
        `;

        // Function to create and render cards
        function renderCards() {
            monthsData.forEach(month => {
                const a = document.createElement('a');
                // If available, route to month.html, else route to coming-soon.html
                a.href = month.available ? month.name.toLowerCase() + '.html' : 'coming-soon.html';
                a.className = `month-card ${month.available ? '' : 'unavailable'}`;
                a.dataset.month = month.name.toLowerCase(); 
                
                a.innerHTML = `
                    <div class="card-content-wrapper">
                        <span class="card-content">${month.name}</span>
                        ${!month.available ? '<span class="badge">Coming Soon</span>' : ''}
                    </div>
                    <div class="card-icon">${month.available ? arrowIcon : lockIcon}</div>
                `;
                
                grid.appendChild(a);
            });
        }

        renderCards();

        // Live Search Filter Logic
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.month-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const monthName = card.dataset.month;
                if (monthName.includes(searchTerm)) {
                    card.classList.remove('hidden');
                    visibleCount++;
                } else {
                    card.classList.add('hidden');
                }
            });

            // Show "No Results" message if no cards are visible
            noResults.style.display = visibleCount === 0 ? 'block' : 'none';
        });

        // Mouse Tracking Glow Effect (Desktop)
        grid.addEventListener('mousemove', e => {
            const cards = document.querySelectorAll('.month-card');
            for(const card of cards) {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            }
        });

        // Touch Tracking Glow & Scale Effect (Mobile)
        grid.addEventListener('touchstart', e => {
            const card = e.target.closest('.month-card');
            if (card) {
                const touch = e.touches[0];
                const rect = card.getBoundingClientRect();
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
                card.classList.add('touch-active');
            }
        }, {passive: true});

        grid.addEventListener('touchend', e => {
            const cards = document.querySelectorAll('.month-card');
            cards.forEach(c => c.classList.remove('touch-active'));
        });
        
        grid.addEventListener('touchcancel', e => {
            const cards = document.querySelectorAll('.month-card');
            cards.forEach(c => c.classList.remove('touch-active'));
        });
    </script>
</body>
</html>
